<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Blind Test – Écran</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261101d">
<style>
  /* Page à projeter sur la TV : jamais de titre de chanson ni de bonne réponse avant la révélation. */
  html { font-size: clamp(14px, 1.35vw, 26px); }
  main { min-height: 100vh; display: flex; flex-direction: column; padding: 2.2rem 3rem; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
  header .brand { font-size: 1.6rem; }
  /* Petit QR code en coin pendant la partie, pour les retardataires */
  #miniQr { position: fixed; right: 1rem; bottom: 1rem; z-index: 5; width: 7.6rem; padding: .4rem; border-radius: .7rem; background: #fff; color: #120a24; text-align: center; font-size: .72rem; font-weight: 700; line-height: 1.2; box-shadow: 0 .3rem 1rem rgba(0,0,0,.45); }
  #miniQr[hidden] { display: none; }
  #miniQrCode svg { width: 100%; height: auto; display: block; }
  #view { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .lobby { display: grid; grid-template-columns: auto 1fr; gap: 3rem; align-items: center; }
  #qr { background: #fff; padding: 1.2rem; border-radius: 1.2rem; width: 22rem; height: 22rem; }
  #qr svg { width: 100%; height: 100%; display: block; }
  .lobby h1 { font-size: 3.2rem; }
  .url { font-size: 1.6rem; font-weight: 800; color: var(--accent2); word-break: break-all; margin: .6rem 0 1.4rem; }
  .warn { background: #5a1a1a; border: 1px solid var(--ko); border-radius: 12px; padding: .8rem 1rem; font-size: 1rem; }
  .count { font-size: 1.4rem; }
  .count b { font-size: 3rem; color: var(--accent2); }
  .ask { font-size: 3.4rem; font-weight: 800; text-align: center; margin: .5rem 0 1.8rem; }
  .choices { grid-template-columns: 1fr 1fr; gap: 1.2rem; }
  .choice { min-height: 7rem; font-size: 1.9rem; padding: 1.2rem 1.6rem; cursor: default; }
  .choice .shape { width: 3rem; height: 3rem; font-size: 1.4rem; }
  .choice .n { margin-left: auto; font-size: 1.5rem; opacity: .9; }
  .choice.good::after { margin-left: 1rem; font-size: 2.4rem; }
  .bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 1.6rem; font-size: 1.3rem; padding-right: 8.6rem; }
  .timer { height: 12px; margin: 1.4rem 8.6rem 0 0; }
  .top5 { margin-top: 1.6rem; }
  .top5 .lb li { font-size: 1.3rem; }
  .podium { max-width: 60rem; margin: .2rem auto .6rem; width: 100%; }
  .podium .who { font-size: 1.8rem; }
  .wall { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1rem; max-height: 11rem; overflow: hidden; }
  .wall .av { width: 4.4rem; height: 4.4rem; font-size: 1.8rem; }
  /* Photos du podium : aussi grandes que la place le permet selon le nombre de joueurs */
  .podium .av { width: 6rem; height: 6rem; font-size: 2.4rem; }
  .podium.mid .av { width: 7.5rem; height: 7.5rem; font-size: 2.8rem; }
  .podium.big .av { width: 10rem; height: 10rem; font-size: 3.8rem; border-width: 4px; }
  .podium.big .p1 .block { height: 8rem; } .podium.big .p2 .block { height: 5.5rem; } .podium.big .p3 .block { height: 3.8rem; }
  .podium.big .block { font-size: 2.6rem; } .podium.mid .block { font-size: 1.8rem; }
  .podium .pts { font-size: 1.2rem; }
  .podium .p1 .block { height: 4.4rem; } .podium .p2 .block { height: 3.2rem; } .podium .p3 .block { height: 2.2rem; }
  .podium .block { font-size: 2.6rem; }
  .rest { max-width: 72rem; margin: 0 auto; width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: .3rem .8rem; }
  .rest li { font-size: 1rem; padding: .15rem .7rem; }
  /* Révélation avec paroles : choix à gauche, karaoké à droite */
  .rv { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 2rem; align-items: start; padding-right: 8.6rem; }
  .rv .ask { font-size: 1.8rem; margin: 0 0 .7rem; text-align: left; }
  .rv .choices { grid-template-columns: 1fr; gap: .5rem; }
  .rv .choice { min-height: 3.2rem; font-size: 1.2rem; padding: .4rem 1rem; }
  .rv .choice .shape { width: 1.9rem; height: 1.9rem; font-size: .9rem; }
  .rv .top5 { margin-top: .9rem; }
  .rv .top5 h2 { font-size: 1.1rem; margin-bottom: .3rem; }
  .rv .top5 .lb { gap: .3rem; }
  .rv .top5 .lb li { font-size: 1rem; padding: .2rem .8rem; }
  .karaoke { background: linear-gradient(160deg, #1db95433, #0b3b2088); border: 1px solid #1db95466; border-radius: 1.4rem; padding: 1.6rem 2rem; }
  .karaoke .kt { font-size: 2rem; font-weight: 800; line-height: 1.15; }
  .karaoke .ka { font-size: 1.3rem; color: #9ee8b9; }
  .khead { display: flex; align-items: center; gap: 1.2rem; margin-bottom: 1.2rem; }
  .kcover { width: 7rem; height: 7rem; flex: none; object-fit: cover; border-radius: .7rem; box-shadow: 0 .4rem 1.4rem rgba(0,0,0,.45); }
  /* Sans paroles : la pochette prend toute la place */
  .karaoke.nolines .khead { flex-direction: column; text-align: center; margin: 0; }
  .karaoke.nolines .kcover { width: min(24rem, 100%); height: auto; aspect-ratio: 1; border-radius: 1rem; }
  .klines { height: 19rem; overflow: hidden; position: relative;
            mask-image: linear-gradient(transparent, #000 18%, #000 78%, transparent); -webkit-mask-image: linear-gradient(transparent, #000 18%, #000 78%, transparent); }
  .klines .track { transition: transform .45s cubic-bezier(.2,.8,.2,1); }
  .kl { font-size: 1.8rem; font-weight: 800; line-height: 1.25; padding: .35rem 6% .35rem 0; overflow-wrap: anywhere; color: rgba(255,255,255,.28); transition: color .3s, transform .3s; transform-origin: left center; }
  .kl.past { color: rgba(255,255,255,.55); }
  .kl.cur { color: #fff; transform: scale(1.04); text-shadow: 0 0 24px rgba(255,255,255,.25); }
  /* Décompte avant la question suivante */
  #countdown { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; background: var(--bg); }
  #countdown[hidden] { display: none; }
  #countdown b { font-size: 16rem; font-weight: 800; line-height: 1; color: var(--accent2); }
  @media (prefers-reduced-motion: reduce) { .klines .track { transition: none; } }
  @media (max-width: 800px) {
    .rv { grid-template-columns: 1fr; } .lobby { grid-template-columns: 1fr; justify-items: center; text-align: center; } main { padding: 1.2rem 16px; } }
</style>
</head>
<body>
<main>
  <header><div class="brand">🎵 Blind <span>Test</span> d'anniversaire</div><span class="pill" id="badge"></span>
    <div id="miniQr" hidden><div id="miniQrCode"></div><span>Rejoins la partie</span></div></header>
  <div id="view"><p class="center muted">Chargement…</p></div>
</main>
<div id="countdown" hidden><b id="cdNum"></b></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="config.js?v=20261101d"></script>
<script>
const SHAPES = ["▲", "◆", "●", "■"];
const view = document.getElementById("view");
let st = null, clockOffset = 0, key = "", timer = null;

// Paroles + position de lecture envoyées par la page animateur (même navigateur).
let lyr = null, now = null, kIdx = -2;
const tv = "BroadcastChannel" in window ? new BroadcastChannel("blindtest-tv") : null;
if (tv) {
  tv.onmessage = (e) => {
    const m = e.data || {};
    if (m.type === "lyrics") { lyr = m; if (st) render(); }
    if (m.type === "now") now = m;
    if (m.type === "countdown") showCountdown(m.n);
  };
  tv.postMessage({ type: "hello" });
}

// Décompte envoyé par la page animateur. Le chiffre est remplacé d'un coup, sans écran vide entre deux chiffres.
// Il reste affiché jusqu'à l'arrivée de la question suivante, ou s'efface seul si la page animateur se ferme.
let cdTimer = null, cdFrom = null;
const cdBox = document.getElementById("countdown"), cdNum = document.getElementById("cdNum");
function showCountdown(n) {
  clearTimeout(cdTimer);
  cdBox.hidden = !n;
  if (!n) return;
  cdFrom = st?.current_q;
  cdNum.textContent = +n;
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) cdNum.animate([{ transform: "scale(1.2)" }, { transform: "scale(1)" }], { duration: 300, easing: "ease-out" });
  cdTimer = setTimeout(() => cdBox.hidden = true, 1800);
}
const hasLyrics = () => lyr && st && lyr.qid === st.current_q && st.status === "reveal";

async function refresh() {
  const { data, error } = await quizDb.rpc("get_state", { p_player_id: null, p_token: null });
  if (error) return;
  st = data;
  clockOffset = new Date(data.server_now).getTime() - Date.now();
  render();
}

function render() {
  if (st.current_q !== cdFrom) showCountdown(0);
  document.getElementById("miniQr").hidden = st.status !== "question" && st.status !== "reveal";
  const k = JSON.stringify([st.status, st.current_q, st.leaderboard?.length, hasLyrics(), lyr?.cover, !!lyr?.lines]);
  document.getElementById("badge").textContent =
    st.status === "lobby" ? "Inscriptions ouvertes" : st.status === "finished" ? "Terminé" : `Question ${st.current_q} / ${st.total_q}`;
  if (k === key) return updateLive();
  key = k;
  clearInterval(timer);
  if (st.status === "lobby") return renderLobby();
  if (st.status === "finished") return renderFinished();
  renderQuestion();
}

// Mur des inscrits sur l'écran d'accueil
const wallHtml = () => (st.lobby_players || []).slice(-40).map((p) => avatarTag(p.id, p.name)).join("");
let wallKey = "";

function updateLive() {
  const wall = document.getElementById("wall"), wk = (st.lobby_players || []).map((p) => p.id).join();
  if (wall && wk !== wallKey) { wallKey = wk; wall.innerHTML = wallHtml(); }
  const c = document.getElementById("cnt"); if (c) c.textContent = st.status === "lobby" ? st.players_count : `${st.answers_count} / ${st.players_count}`;
}

const qrSvg = () => { const qr = qrcode(0, "M"); qr.addData(playerUrl); qr.make(); return qr.createSvgTag({ scalable: true, margin: 0 }); };
document.getElementById("miniQrCode").innerHTML = qrSvg();

function renderLobby() {
  view.innerHTML = `
    <div class="lobby pop">
      <div id="qr"></div>
      <div>
        <h1>Scanne pour jouer ! 📱</h1>
        <p class="muted" style="font-size:1.2rem">ou va sur</p>
        <div class="url">${esc(playerUrl)}</div>
        ${isLocalUrl ? `<div class="warn">⚠️ Cette adresse est locale à l'ordinateur : les téléphones ne pourront pas l'ouvrir. Il faut d'abord mettre l'appli en ligne.</div>` : ""}
        <p class="count"><b id="cnt">${st.players_count}</b> joueur(s) inscrit(s)</p>
        <div class="wall" id="wall">${wallHtml()}</div>
      </div>
    </div>`;
  document.getElementById("qr").innerHTML = qrSvg();
}

function renderQuestion() {
  const q = st.question, reveal = st.status === "reveal";
  if (reveal && hasLyrics()) return renderKaraoke();
  view.innerHTML = `
    <div class="pop">
      <div class="ask">${q.kind === "artist" ? "🎤 Qui chante ?" : "🎶 Quel est le titre ?"}</div>
      <div class="choices">${q.choices.map((c, i) => `
        <div class="choice c${i} ${reveal ? (i === st.correct_index ? "good" : "dim") : ""}">
          <span class="shape">${SHAPES[i]}</span><span>${esc(c)}</span></div>`).join("")}</div>
      ${reveal ? `<div class="top5"><h2>Top 5</h2><ol class="lb">${(st.top || []).map((p) =>
          `<li><span class="rk">${p.rank}</span>${avatarTag(p.id, p.name)}<span class="nm">${esc(p.name)}</span><span class="sc">${p.score}</span></li>`).join("")}</ol></div>`
        : `<div class="timer"><div id="bar" style="width:100%"></div></div>
           <div class="bottom"><span class="muted">Réponds sur ton téléphone !</span><span>✋ <b id="cnt">${st.answers_count} / ${st.players_count}</b> ont répondu</span></div>`}
    </div>`;
  if (!reveal) { tick(); timer = setInterval(tick, 250); }
}

function renderKaraoke() {
  const q = st.question;
  view.innerHTML = `
    <div class="rv pop">
      <div>
        <div class="ask">${q.kind === "artist" ? "🎤 Qui chante ?" : "🎶 Quel est le titre ?"}</div>
        <div class="choices">${q.choices.map((c, i) => `
          <div class="choice c${i} ${i === st.correct_index ? "good" : "dim"}"><span class="shape">${SHAPES[i]}</span><span>${esc(c)}</span></div>`).join("")}</div>
        <div class="top5"><h2>Top 5</h2><ol class="lb">${(st.top || []).map((p) =>
          `<li><span class="rk">${p.rank}</span>${avatarTag(p.id, p.name)}<span class="nm">${esc(p.name)}</span><span class="sc">${p.score}</span></li>`).join("")}</ol></div>
      </div>
      <div class="karaoke ${lyr.lines ? "" : "nolines"}">
        <div class="khead">
          ${lyr.cover ? `<img class="kcover" src="${esc(lyr.cover)}" alt="Pochette de ${esc(lyr.title)}">` : ""}
          <div><div class="kt">${esc(lyr.title)}</div><div class="ka">${esc(lyr.artist)}</div></div>
        </div>
        ${lyr.lines
          ? `<div class="klines" id="klines"><div class="track" id="ktrack">${lyr.lines.map((l) => `<div class="kl">${esc(l.text) || "♪"}</div>`).join("")}</div></div>`
          : ""}
      </div>
    </div>`;
  kIdx = -2;
  if (lyr.lines) { karaokeTick(); timer = setInterval(karaokeTick, 120); }
}

// Met en avant la ligne en cours selon la position de lecture Spotify (interpolée entre deux relevés).
function karaokeTick() {
  const box = document.getElementById("klines"), track = document.getElementById("ktrack");
  if (!box || !track) return;
  let idx = -1;
  if (now && now.qid === st.current_q) {
    const pos = (now.progress_ms + (now.is_playing ? Date.now() - now.at : 0)) / 1000 + 0.15;
    for (let i = 0; i < lyr.lines.length && lyr.lines[i].t <= pos; i++) idx = i;
  }
  if (idx === kIdx) return;
  kIdx = idx;
  const rows = track.children;
  for (let i = 0; i < rows.length; i++) rows[i].className = "kl" + (i < idx ? " past" : i === idx ? " cur" : "");
  const ref = rows[Math.max(idx, 0)];
  const y = ref ? ref.offsetTop - box.clientHeight * 0.38 : 0;
  track.style.transform = `translateY(${-Math.max(0, y)}px)`;
}

function tick() {
  const bar = document.getElementById("bar"); if (!bar || !st.q_started_at) return;
  const secs = (Date.now() + clockOffset - new Date(st.q_started_at).getTime()) / 1000;
  bar.style.width = Math.max(0, 1 - secs / QUIZ_CONFIG.bonusSeconds) * 100 + "%";
}

function renderFinished() {
  const lb = st.leaderboard || [], top = [lb[1], lb[0], lb[2]];
  view.innerHTML = `
    <div class="pop">
      <h1 class="center" style="font-size:2.6rem;margin:0">🏆 Classement final</h1>
      <div class="podium ${lb.length <= 3 ? "big" : lb.length <= 9 ? "mid" : ""}">${top.map((p, k) => p ? `
        <div class="step p${[2, 1, 3][k]}">${avatarTag(p.id, p.name)}<div class="who">${esc(p.name)}</div><div class="pts">${p.score} pts · ${p.good} ✓</div>
        <div class="block">${["🥈", "🥇", "🥉"][k]}</div></div>` : "<div></div>").join("")}</div>
      <ol class="lb rest">${lb.slice(3, 18).map((p) =>
        `<li><span class="rk">${p.rank}</span>${avatarTag(p.id, p.name)}<span class="nm">${esc(p.name)}</span><span class="sc">${p.score}</span></li>`).join("")}</ol>
    </div>`;
}

watchGame(refresh, 1500);
</script>
</body>
</html>
